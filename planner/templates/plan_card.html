<a class="card plan-card" href="{% url 'plan_detail' plan.pk %}"><div class="section-title"><span class="pill">{{ plan.intensity }}{% if plan.archived %} · Archived{% endif %}</span><span class="arrow-circle">↗</span></div><h3>{{ plan.title }}</h3><p>{{ plan.starts_at|date:'d M Y · H:i' }}</p><div class="plan-meta"><span>◷ {{ plan.minutes }} min</span><span>◈ {{ plan.mood }}</span><span>Focus {{ plan.focus }}/10</span></div></a>
